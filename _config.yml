# jekyll-seo-tag
author:
  name: "AKM Azad"
  url: "https://akmazad.github.io/people/#pi"
twitter:
  username: AkmAzad_Bioinfo
  card: summary_large_image
social_links:
  name: "AKM Azad"
  links:
    - "https://scholar.google.com/citations?user=p-Rne_wAAAAJ"
    - "https://orcid.org/0000-0002-5251-2214"
    - "https://github.com/Akmazad"
    - "https://www.linkedin.com/in/a-k-m-azad-6039931a"

# Build -----------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  math_engine: mathjax

permalink: /blog/:year/:title/
excerpt_separator: "<!--more-->"
future: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: /blog/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      comments: false
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/img/og-card.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - .vscode
  - node_modules
  - tools
  - scripts
  - "*.py"

include:
  - _redirects
