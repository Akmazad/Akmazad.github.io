title: "ADNS Lab"
long_title: "Advanced Data & Network Science Lab"
tagline: "Bayesian, network and AI methods for biomedicine and assistive technology"
description: >-
  The Advanced Data & Network Science (ADNS) Lab, led by Dr AKM Azad at Imam Mohammad Ibn Saud
  Islamic University (IMSIU), Riyadh, develops Bayesian, network-science and AI methods for
  cancer systems biology, drug repositioning, trustworthy medical AI and AI-empowered assistive technology for disability.
url: "https://akmazad.github.io"
baseurl: ""
lang: en
timezone: Asia/Riyadh
logo: /assets/img/adns-logo.png

# Lab identity ---------------------------------------------------------------
lab:
  short: "ADNS Lab"
  name: "Advanced Data & Network Science Lab"
  pi: "Dr AKM Azad"
  institution: "Imam Mohammad Ibn Saud Islamic University (IMSIU)"
  department: "Department of Mathematics & Statistics, Faculty of Science"
  city: "Riyadh, Saudi Arabia"
  email: "kazad@imamu.edu.sa"
  founded: 2022

