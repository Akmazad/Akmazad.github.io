<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1020">
{% seo %}
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} blog" href="{{ '/blog/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("adns-theme"); } catch (e) {}
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
{% if page.math %}
<script>
  window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] }, svg: { fontCache: "global" } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": {{ site.lab.name | jsonify }},
  "alternateName": {{ site.lab.short | jsonify }},
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "logo": {{ site.logo | absolute_url | jsonify }},
  "email": {{ site.lab.email | jsonify }},
  "parentOrganization": { "@type": "CollegeOrUniversity", "name": {{ site.lab.institution | jsonify }} },
  "founder": { "@type": "Person", "name": "AKM Azad", "jobTitle": "Associate Professor", "sameAs": [{{ site.social.scholar | jsonify }}, {{ site.social.orcid | jsonify }}, {{ site.social.github | jsonify }}] },
  "address": { "@type": "PostalAddress", "addressLocality": "Riyadh", "addressCountry": "SA" }
}
</script>
