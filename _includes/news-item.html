{%- assign n = include.n -%}
<li class="k-{{ n.kind }}{% if n.pinned %} pinned{% endif %}"><time datetime="{{ n.date }}">{% if n.pinned %}<i class="fa-solid fa-thumbtack" aria-hidden="true"></i> {% endif %}{% if n.approx %}{{ n.date | date: '%Y' }}{% else %}{{ n.date | date: '%b %Y' }}{% endif %}</time><span class="ntitle">{% if n.link %}<a href="{% if n.link contains '://' %}{{ n.link }}{% else %}{{ n.link | relative_url }}{% endif %}">{{ n.title }}</a>{% else %}{{ n.title }}{% endif %}</span>{% if n.text %}<p>{{ n.text }}</p>{% endif %}</li>
