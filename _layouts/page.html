---
layout: default
---
<section class="page-hero">
  <canvas class="net-canvas" aria-hidden="true"></canvas>
  <div class="container page-hero-inner">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
    {% if page.subnav %}
      <nav class="subnav" aria-label="On this page">
        {% for s in page.subnav %}<a href="{{ s.url | relative_url }}">{{ s.title }}</a>{% endfor %}
      </nav>
    {% endif %}
  </div>
</section>
<div class="container page-body{% if page.wide %} wide{% endif %}">
  {{ content }}
</div>
