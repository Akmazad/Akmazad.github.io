<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  {% include nav.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% if page.scripts %}{% for s in page.scripts %}<script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endfor %}{% endif %}
</body>
</html>
