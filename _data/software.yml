  blog: /blog/2018/bnmcmc-software/

- id: xtalkiis
  name: XTalkiiS
  kind: tool
  status: archived
  year: 2018
  lang: [C#]
  theme: cancer
  summary: >-
    Predicts data-driven cross-talk between KEGG pathways within one organism or between two
    organisms (for example host–parasite), with live KEGG retrieval.
  links:
    - { label: "Code", url: "https://github.com/Akmazad/XTalkiiS", icon: github }
    - { label: "Download", url: "https://sourceforge.net/projects/xtalkiis/", icon: download }
    - { label: "Preprint", url: "https://doi.org/10.1101/437541", icon: paper }
  blog: /blog/2018/xtalkiis-inter-species-cross-talk/

- id: kpgminer
  name: KPGminer
  kind: tool
  status: archived
  year: 2018
  lang: [C#]
  theme: omics
  summary: >-
