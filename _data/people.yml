# People. To add a member, copy a block under `team` and fill in name/photo/links.
# Photos go in /images/people/ (square, ~600x600). Leave `photo` empty to show initials.

pi:
  name: "AKM Azad, PhD"
  short: "Dr AKM Azad"
  role: "Lab Director · Associate Professor of Data Science, AI & Biostatistics"
  affiliation: "Department of Mathematics & Statistics, Faculty of Science, and Deanship of Scientific Research, Imam Mohammad Ibn Saud Islamic University (IMSIU), Riyadh"
  photo: /images/profile.jpg
  email: kazad@imamu.edu.sa
  bio: >-
    Dr Azad is an interdisciplinary data scientist with 12+ years of university teaching and research
    across Saudi Arabia and Australia. He trained in computer science (BSc, University of Dhaka), data mining
    and computational biology (MS, GIST, South Korea) and biostatistics and AI (PhD, Monash University),
    then held research and academic posts at Monash University, UNSW Sydney, the University of Sydney,
    the University of Technology Sydney, Children's Medical Research Institute (ProCan) and Swinburne
    University of Technology before joining IMSIU in 2022. He leads the lab's disability-research programme,
    funded by the King Salman Center for Disability Research, and is Guest Editor for <em>Diagnostics</em> (MDPI),
    and a reviewer for <em>Briefings in Bioinformatics</em>, <em>PLOS ONE</em>, <em>Artificial Intelligence Review</em>
    and BMC journals.
  highlights:
    - "PhD (Biostatistics & AI), Monash University, 2017"
    - "1st prize, AI Hackathon for People with Disabilities, 2026"
    - "Recognition of Teaching Excellence, Swinburne, 2021"
    - "Australian Academy of Science COVID-19 expert"
    - "Australian citizen · Saudi Premium Residency"

